# CI for Interactive World Map (WPF requires Windows)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "6.0.x"

      - name: Restore
        run: dotnet restore InteractiveWorldMap.sln

      - name: NuGet vulnerability check
        shell: pwsh
        run: python scripts/verify_nuget_vulnerabilities.py

      - name: Build
        run: dotnet build InteractiveWorldMap.sln --configuration Release --no-restore

      - name: Format
        run: dotnet format InteractiveWorldMap.sln --verify-no-changes

      - name: Test
        run: dotnet test Tests/InteractiveWorldMap.Tests.csproj --configuration Release --no-build --verbosity normal --settings .runsettings --filter "Category!=Performance" --collect:"XPlat Code Coverage" --results-directory TestResults\ci-coverage
        # Remediation: run `dotnet test Tests/InteractiveWorldMap.Tests.csproj --filter "Category!=Performance"` locally

      - name: Enforce coverage threshold
        shell: pwsh
        run: python scripts/summarize_coverage.py --results-directory TestResults/ci-coverage --min-line-coverage 45 --min-branch-coverage 40

      - name: Install Lizard
        run: python -m pip install lizard

      - name: Lizard complexity warning
        run: lizard -C 15 -x "*Tests*" -x "*Tools*" -x "*bin*" -x "*obj*" -x "*scripts*" -x "*TestResults*" .
        continue-on-error: true

      - name: Lizard complexity fail
        run: lizard -C 20 -x "*Tests*" -x "*Tools*" -x "*bin*" -x "*obj*" -x "*scripts*" -x "*TestResults*" .

      - name: Verify doc links
        shell: pwsh
        run: python scripts/verify_doc_links.py
        continue-on-error: false

      - name: Taste checks
        shell: pwsh
        run: python scripts/verify_taste.py

      - name: Headless startup validation
        shell: pwsh
        run: .\scripts\validate_startup.ps1
        # REMEDIATION: Run scripts/verify.ps1 locally on Windows for the full harness loop
