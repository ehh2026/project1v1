# Weekly harness entropy check — documentation drift
name: Doc Gardening

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

# Read-only by default. Nothing here writes to the repo, comments on a PR, or
# publishes: these jobs check out the code and run builds, tests and scripts.
# A job that later needs to write should widen this itself rather than removing it.
permissions:
  contents: read

jobs:
  doc-gardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Doc gardening checks
        run: python scripts/doc_gardening.py
