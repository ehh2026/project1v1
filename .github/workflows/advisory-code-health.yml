name: Advisory Code Health

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  advisory:
    name: Advisory health and coverage
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Code health report
        shell: pwsh
        run: python scripts\advisory_code_health.py

      - name: Coverage run
        shell: pwsh
        run: >
          dotnet test Tests\InteractiveWorldMap.Tests.csproj
          --configuration Release
          --settings .runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults\coverage-advisory

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: python scripts\summarize_coverage.py --results-directory TestResults\coverage-advisory

      - name: Preview coverage threshold
        shell: pwsh
        run: python scripts/summarize_coverage.py --results-directory TestResults/coverage-advisory --min-line-coverage 45 --min-branch-coverage 40
        continue-on-error: true

      - name: Install Lizard
        run: python -m pip install lizard

      - name: Lizard complexity warning
        run: lizard -C 15 -x "*Tests*" -x "*Tools*" -x "*bin*" -x "*obj*" -x "*scripts*" -x "*TestResults*" .
        continue-on-error: true
