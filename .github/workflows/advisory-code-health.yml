name: Advisory Code Health

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  advisory:
    name: Advisory health and coverage
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Code health report
        shell: pwsh
        run: py -3 scripts\advisory_code_health.py

      - name: Coverage run
        shell: pwsh
        run: >
          dotnet test Tests\InteractiveWorldMap.Tests.csproj
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults\coverage-advisory

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: py -3 scripts\summarize_coverage.py TestResults\coverage-advisory
