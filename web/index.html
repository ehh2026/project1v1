<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive World Map</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #0d1b2a; font-family: Georgia, 'Times New Roman', serif; }
  #map { height: 100%; width: 100%; background: #0d1b2a; }

  /* Drawn pin: teardrop via border-radius trick (no image asset needed) */
  .map-pin {
    width: 26px; height: 26px;
    background: #b23a48;
    border: 2px solid #fff;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 2px 4px rgba(0,0,0,.5);
    cursor: pointer;
  }
  .map-pin::after {
    content: ""; position: absolute; inset: 6px;
    background: #fff; border-radius: 50%;
  }

  /* Popup styling */
  .leaflet-popup-content-wrapper {
    max-width: min(680px, 94vw);
    border-radius: 10px;
  }
  .leaflet-popup-content { margin: 16px 20px; line-height: 1.5; font-size: 1rem; }
  .popup-title { margin: 0 0 4px; font-size: 1.3rem; }
  @media (max-width: 640px) {
    .leaflet-popup-content { font-size: 1.05rem; }
    .popup-title { font-size: 1.4rem; }
  }
  .popup-address { color: #777; font-style: italic; margin: 0 0 8px; font-size: .85rem; }
  .popup-bio { font-size: .9rem; margin: 8px 0; white-space: pre-line; }
  .popup-figure { margin: 8px 0 0; }
  .popup-figure img { width: 100%; height: auto; display: block; border-radius: 4px; }
  .popup-caption { font-size: .8rem; color: #555; margin-top: 4px; }
  .leaflet-popup-content p { margin: 6px 0; }

  /* Accessibility: instructions for assistive tech only */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  /* Visible focus rings for pins and popup controls */
  .leaflet-marker-icon:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
  .leaflet-popup-close-button:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }
</style>
</head>
<body>
<h1 class="visually-hidden">Interactive World Map</h1>
<p class="visually-hidden">
  Browse with the mouse or touch. Keyboard users: press Tab to reach location
  pins, press Enter to open a location's information, and press Escape to close it.
</p>
<div id="map" role="region" aria-label="Interactive world map"></div>
<script>
(async function () {
  const data = await (await fetch('data/locations.json')).json();
  const { width: W, height: H, image } = data.map;

  // Coordinate contract: nx/ny are [0,1] fractions, origin top-left of the image.
  // CRS.Simple y increases upward, so lat = (1 - ny) * H and lng = nx * W.
  const bounds = [[0, 0], [H, W]];
  const map = L.map('map', {
    crs: L.CRS.Simple,
minZoom: -2,
  maxZoom: 6,
    zoomControl: true,
    attributionControl: false,
  });
  map.fitBounds(bounds);

  // Whole-map tile pyramid (Stage 3A): the 4096 px base stays the initial
  // overview; tiles take over at/above the pyramid's minimum (map) zoom so
  // zoomed regions stay sharp without decoding the whole map. URL zoom is the
  // map zoom shifted by the manifest's baseZoom (zoomOffset), and `bounds`
  // keeps tile requests inside the image.
  const baseImage = L.imageOverlay(image, bounds).addTo(map);
  const tilesM = data.tiles;
  const tileLayer =
    tilesM && Array.isArray(tilesM.levels) && tilesM.levels.length
      ? L.tileLayer(tilesM.url, {
          tileSize: tilesM.tileSize,
          zoomOffset: tilesM.baseZoom,
          minZoom: Math.min(...tilesM.levels) - tilesM.baseZoom,
          maxZoom: 6,
          maxNativeZoom: Math.max(...tilesM.levels) - tilesM.baseZoom,
          noWrap: true,
          bounds,
        })
      : null;
  if (tileLayer) tileLayer.addTo(map);

  function syncBase() {
    if (!tileLayer) return;
    baseImage.setOpacity(map.getZoom() >= tileLayer.options.minZoom ? 0 : 1);
  }
  map.on('zoomend moveend resize viewreset', syncBase);
  syncBase();

  const pinIcon = L.divIcon({
    className: '',
    html: '<div class="map-pin" aria-hidden="true"></div>',
    iconSize: [26, 26],
    iconAnchor: [13, 26],
    popupAnchor: [0, -26],
  });

  const markerById = new Map();
  for (const loc of data.locations) {
    const marker = L.marker([(1 - loc.ny) * H, loc.nx * W], {
      id: loc.id,
      icon: pinIcon,
      title: loc.name,
      alt: loc.name,
      keyboard: true,
    });

    // Build popups as DOM nodes (textContent, not HTML strings) — workbook
    // values are untrusted text and may contain characters like '<' or quotes.
    const popup = document.createElement('div');

    const title = document.createElement('h2');
    title.className = 'popup-title';
    title.textContent = loc.name;
    popup.appendChild(title);

    if (loc.address) {
      const p = document.createElement('p');
      p.className = 'popup-address';
      p.textContent = loc.address;
      popup.appendChild(p);
    }
    if (loc.bio) {
      const bio = document.createElement('div');
      bio.className = 'popup-bio';
      bio.textContent = loc.bio;
      popup.appendChild(bio);
    }
    for (const img of loc.images ?? []) {
      if (img.missing) continue;
      // Only allow image paths inside our own bundle.
      if (!/^images\/content\/[\w\-. ]+\/[\w\-. ]+$/.test(img.file)) continue;
      const fig = document.createElement('figure');
      fig.className = 'popup-figure';
      const el = document.createElement('img');
      el.src = img.file;
      el.alt = img.altText || loc.name;
      el.loading = 'lazy';
      fig.appendChild(el);
      if (img.altText) {
        const cap = document.createElement('figcaption');
        cap.className = 'popup-caption';
        cap.textContent = img.altText;
        fig.appendChild(cap);
      }
      popup.appendChild(fig);
    }

    marker.bindPopup(popup, { maxWidth: 680 });
    markerById.set(loc.id, marker);
    marker.addTo(map);
    if (marker._icon) {
      marker._icon.setAttribute('aria-label', loc.name);
    }
    // Keyboard basics (Stage 3A): toggle the popup with Space. Enter is already
    // handled by Leaflet's bindPopup keypress handler (opens), and Leaflet's
    // autoPanOnFocus (default true) pans a focused pin into view.
    marker.on('keydown', (e) => {
      const key = e.originalEvent.key;
      if (key === ' ') {
        e.originalEvent.preventDefault();
        marker.togglePopup();
      }
    });
  }

  // Regional high-res crops: create an overlay only while the crop is near the
  // current viewport at or above the zoom threshold, and remove it (freeing the
  // decoded image and its network transfer) when it is no longer relevant. This
  // keeps distant crops out of the mobile initial transfer entirely.
  const crops = data.crops ?? [];
  const cropLayers = new Map();  // crop -> active L.ImageOverlay

  const ZOOM_THRESHOLD = 1;
  function cropBounds(c) {
    return L.latLngBounds([ (1 - c.ny1) * H, c.nx0 * W ], [ (1 - c.ny0) * H, c.nx1 * W ]);
  }
  function updateCrops() {
    const z = map.getZoom();
    const near = map.getBounds().pad(0.5);
    crops.forEach((c) => {
      const active = cropLayers.get(c);
      const cb = cropBounds(c);
      const needed = z >= ZOOM_THRESHOLD && near.intersects(cb);
      if (needed && !active) {
        cropLayers.set(c, L.imageOverlay(c.file, cb).addTo(map));
      } else if (!needed && active) {
        active.remove();
        cropLayers.delete(c);
      }
    });
  }
  map.on('zoomend moveend resize viewreset', updateCrops);
  updateCrops();

  // Stable deep links (Stage 3A): #location=<stable-id> pans to and opens a
  // location. Ids are name-derived in the manifest, so they survive harmless
  // source-row reordering; unknown ids fail harmlessly.
  const DEEP_LINK_ZOOM = tileLayer ? tileLayer.options.minZoom : ZOOM_THRESHOLD;
  function handleDeepLink() {
    const m = /(?:^|&)location=([^&]+)/.exec(location.hash.slice(1));
    if (!m) return;
    let id;
    try {
      id = decodeURIComponent(m[1]);
    } catch (err) {
      console.info('Malformed location hash ignored');
      return;
    }
    const marker = markerById.get(id);
    if (!marker) {
      console.info('Unknown location id: ' + id);
      return;
    }
    map.setView(marker.getLatLng(), Math.max(map.getZoom(), DEEP_LINK_ZOOM), { animate: false });
    marker.openPopup();
  }
  window.addEventListener('hashchange', handleDeepLink);
  handleDeepLink();

  // Reflect the open popup's location in the URL without adding history, and
  // move focus into the popup predictably so Escape/close can hand it back.
  let popupOrigin = null;
  map.on('popupopen', (e) => {
    const source = e.popup && e.popup._source;
    if (source && source.options && source.options.id) {
      popupOrigin = source;
      history.replaceState(null, '', '#location=' + encodeURIComponent(source.options.id));
    }
    const container = e.popup.getElement();
    if (container) {
      container.setAttribute('tabindex', '-1');
      container.focus({ preventScroll: true });
    }
  });
  map.on('popupclose', () => {
    if (popupOrigin && popupOrigin._icon) popupOrigin.focus({ preventScroll: true });
    popupOrigin = null;
  });
})();
</script>
</body>
</html>
